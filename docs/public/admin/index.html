<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>内容管理后台</title>
  <style>
    html, body { margin: 0; padding: 0; background: #0d1117; color: #e6edf3; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
    #loader { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; background: #0d1117; z-index: 10; }
    .spinner { width: 40px; height: 40px; border: 4px solid #30363d; border-top-color: #42b883; border-radius: 50%; animation: spin 0.9s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    #loader p { color: #8b949e; font-size: 14px; margin: 0; }
    #cms { min-height: 100vh; }
  </style>
</head>
<body>
  <div id="loader">
    <div class="spinner"></div>
    <p>正在加载内容管理后台…</p>
  </div>

  <!--
    两种后端认证方式，二选一：

    1) git-gateway（配合 Netlify Identity，若部署在 Netlify）：
       取消下一行注释，并在 config.yml 中将 backend 改为 git-gateway
  -->
  <!-- <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script> -->

  <!-- 2) GitHub 官方后端：通过 GitHub OAuth App 完成认证 -->
  <script src="https://unpkg.com/decap-cms@^3.3.3/dist/decap-cms.js"></script>

  <script>
    // 当 Decap CMS 加载完成后隐藏加载动画
    window.addEventListener('load', function () {
      var t = setInterval(function () {
        if (window.CMS && document.querySelector('.css-1wxqy8x, [class*="Sidebar"], nav')) {
          clearInterval(t)
          var loader = document.getElementById('loader')
          if (loader) loader.style.display = 'none'
        }
      }, 300)
      // 兜底：3 秒后隐藏加载动画，避免遮挡登录界面
      setTimeout(function () {
        var loader = document.getElementById('loader')
        if (loader) loader.style.display = 'none'
      }, 3000)
    })
  </script>
</body>
</html>
